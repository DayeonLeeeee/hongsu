# push·PR마다 테스트와 lint. 외부 API는 부르지 않는다 (Claude·Gemini는 테스트에서 가짜로 바꾼다).
# 실제 PostgreSQL 저장 테스트도 같이 돈다 (TEST_DATABASE_URL).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]   # 3.9 = README 최소 버전, 3.12 = Railway(nixpacks.toml)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pyflakes
      - name: lint (pyflakes)
        run: python -m pyflakes hongsu prompts experiments tests rv2_grader.py rv2_codebook.py run_batch.py hongsu_server.py
      - name: tests
        run: python -m pytest tests -q
